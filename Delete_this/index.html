<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Goose Egg Clicker - An incremental game where you collect goose eggs">
    <title>Goose Egg Clicker | Incremental Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="game-header">
            <h1>🦆 Goose Egg Clicker 🥚</h1>
            <button id="helpBtn" class="help-button">❓ Help</button>
        </header>

        <!-- Game Main Area -->
        <div class="game-wrapper">
            <!-- Scoreboard Section -->
            <aside class="scoreboard">
                <div class="score-item">
                    <label>Total Eggs</label>
                    <div id="totalEggs" class="score-value">0</div>
                </div>
                <div class="score-item">
                    <label>Click Value</label>
                    <div id="clickValue" class="score-value">1</div>
                </div>
                <div class="score-item">
                    <label>Auto-Click Rate</label>
                    <div id="autoClickRate" class="score-value">Off</div>
                </div>
                <div class="score-item">
                    <label>Active Upgrades</label>
                    <div id="activeUpgrades" class="upgrades-list"></div>
                </div>
            </aside>

            <!-- Click Area Section -->
            <main class="click-section">
                <button id="clickBtn" class="click-button">
                    <span class="egg-icon">🥚</span>
                    <span class="click-text">Click for Eggs!</span>
                </button>
                <p id="clickFeedback" class="click-feedback"></p>
            </main>

            <!-- Upgrades Section -->
            <aside class="upgrades-section">
                <h2>Upgrades</h2>
                <div id="upgradesContainer" class="upgrades-grid">
                    <!-- Upgrades will be inserted here by JS -->
                </div>
            </aside>
        </div>

        <!-- Rewards Section -->
        <section class="rewards-section">
            <h2>🏆 Rewards 🏆</h2>
            <div id="rewardsContainer" class="rewards-grid">
                <!-- Rewards will be inserted here by JS -->
            </div>
            <div id="rewardNotification" class="reward-notification" style="display: none;">
                <span id="rewardMessage"></span>
            </div>
        </section>
    </div>

    <!-- Help Modal -->
    <div id="helpModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Help & Instructions</h2>
            
            <h3>How to Play</h3>
            <p>Click the big egg button to collect eggs! Use eggs to buy upgrades that make clicking more efficient.</p>
            
            <h3>Click Value Upgrades</h3>
            <ul id="helpClickUpgrades"></ul>
            
            <h3>Auto-Click Upgrades</h3>
            <ul id="helpAutoUpgrades"></ul>
            
            <h3>Rewards & Milestones</h3>
            <ul id="helpRewards"></ul>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
