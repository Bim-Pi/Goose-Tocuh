<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Goose lays eggs</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src ="js/script.js"></script>
</head>
<body>
    <div id="game-container">
        
        <!-- HEADER -->
        <header id="header">
            <img id="logo" src="images/goose_circle.png" width="100" alt="Goose Logo">
            <h1>Goose Lays Eggs Clicker</h1>
            <button id="help-button">Help</button>
        </header>

        <!-- HELP MODAL -->
        <div id="help-modal">
            <div class="modal-content">
                <button id="close-help">&times;</button>
                <h2>How to Play</h2>
                <p>Click the goose to lay its egg and earn eggs! Use your eggs to buy upgrades.</p>
            </div>
        </div>

        <!-- MAIN GAME CONTENT -->
        <main id="main-content">
            
            <!-- LEFT SIDE -->
            <section id="left-panel">
                
                <!-- CLICK AREA -->
                <div id="click-area">
                    <div id="click-zone">
                        <img id="goose-image" src="images/GooseLayingEgg.png" alt="Goose">
                    </div>
                </div>

                <!-- DRUG AREA -->
                <div id="drug-area">
                    <label id="drug-sign"></label>
                </div>

                <!-- SCOREBOARD .-->
                <div id="scoreboard">
                    <h2>Scoreboard</h2>
                    <div class="score-item">
                        <label>Total Eggs:</label>
                        <span id="resource-count">0</span>
                    </div>
                    <div class="score-item">
                        <label>Eggs Laid Per Click:</label>
                        <span id="click-value">1</span>
                    </div>
                    <div class="score-item">
                        <label>Active Eggs Laid(Per Second):</label>
                        <span id="active-upgrades-count">0</span>
                    </div>
                </div>

            </section>

            <!-- RIGHT SIDE -->
            <section id="right-panel">
                
                <!-- UPGRADES AREA -->
                <div id="upgrades-section">
                    <h2>Upgrades</h2>
                    <div id="upgrades-container">
                        <div class="upgrade" id="upgrade-drugs">
                            <img src="images/labor-inducing drugs.png" width="50" alt="upgrade1">
                            <h3>labor-inducing drugs(Eggs: <span id="upgrade1-cost">10</span>)</h3>
                            <span class="count" id="upgrade1-count">0</span>
                        </div>
                        <div class="upgrade" id="upgrade-geese">
                            <img src="images/goose.png" width="50" alt="upgrade2">
                            <h3>labor-inducing drugs(Eggs: <span id="upgrade2-cost">100</span>)</h3>
                            <span class="count" id="upgrade2-count">0</span>
                        </div>
                    </div>
                </div>

                <!-- REWARDS AREA -->
                <div id="rewards-section">
                    <h2>Rewards & Badges</h2>
                    <div id="rewards-container"></div>
                </div>

            </section>

        </main>

        <!-- CONGRATULATIONS MESSAGE -->
        <div id="congratulations-message">
            <p id="congratulations-text"></p>
        </div>

    </div>
</body>
</html>
