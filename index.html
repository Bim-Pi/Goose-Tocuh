<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Goose Touch</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src ="js/script.js"></script>
</head>
<body>
    <div id="game-container">
        
        <!-- HEADER -->
        <header id="header">
            <img id="logo" src="images/goose_circle.png" width="100" alt="Goose Logo">
            <h1>Goose Honking Clicker</h1>
            <button id="help-button">Help</button>
        </header>

        <!-- HELP MODAL -->
        <div id="help-modal">
            <div class="modal-content">
                <button id="close-help">&times;</button>
                <h2>How to Play</h2>
                <p>Click the goose to make it honk and earn honks! Use your honks to buy upgrades.</p>
                
                <h3>Upgrades</h3>
                <ul id="help-upgrades-list"></ul>
                
                <h3>Rewards & Badges</h3>
                <ul id="help-rewards-list"></ul>
            </div>
        </div>

        <!-- MAIN GAME CONTENT -->
        <main id="main-content">
            
            <!-- LEFT SIDE -->
            <section id="left-panel">
                
                <!-- CLICK AREA -->
                <div id="click-area">
                    <div id="click-zone">
                        <img id="goose-image" src="images/GooseHonking.png" alt="Goose">
                    </div>
                </div>

                <!-- SCOREBOARD -->
                <div id="scoreboard">
                    <h2>Scoreboard</h2>
                    <div class="score-item">
                        <label>Total Honks:</label>
                        <span id="resource-count">0</span>
                    </div>
                    <div class="score-item">
                        <label>Honks Per Click:</label>
                        <span id="click-value">1</span>
                    </div>
                    <div class="score-item">
                        <label>Active Upgrades:</label>
                        <span id="active-upgrades-count">0</span>
                    </div>
                </div>

            </section>

            <!-- RIGHT SIDE -->
            <section id="right-panel">
                
                <!-- UPGRADES AREA -->
                <div id="upgrades-section">
                    <h2>Upgrades</h2>
                    <div id="upgrades-container"></div>
                </div>

                <!-- REWARDS AREA -->
                <div id="rewards-section">
                    <h2>Rewards & Badges</h2>
                    <div id="rewards-container"></div>
                </div>

            </section>

        </main>

        <!-- CONGRATULATIONS MESSAGE -->
        <div id="congratulations-message">
            <p id="congratulations-text"></p>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
